<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked by focus</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --bg: #fbfbfd;
        --code: #ececf0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #f5f5f7;
          --muted: #a1a1a6;
          --bg: #1c1c1e;
          --code: #2c2c2e;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      main {
        max-width: 34rem;
        padding: 2rem 1rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.75rem 0;
      }
      .url {
        color: var(--muted);
        word-break: break-all;
      }
      code {
        background: var(--code);
        padding: 0.1em 0.35em;
        border-radius: 4px;
        font: 0.9em ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .error {
        color: #c4372d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Blocked by focus</h1>
      <p class="url" id="url"></p>
      <p id="reason">Only the subreddits you've allowed load while focus is on.</p>
      <p id="howto"></p>
      <p class="error" id="error" hidden></p>
      <p>This page goes back to the link by itself once it's allowed or focus is off.</p>
    </main>
    <script src="blocked.js" type="module"></script>
  </body>
</html>
